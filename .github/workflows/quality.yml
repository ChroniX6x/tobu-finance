name: Quality
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  full:
    name: Full quality (Linux, Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
          cache: npm
      - run: npm install --global npm@11.8.0
      - run: npm ci
      - run: git diff --exit-code -- package-lock.json
      - run: npm exec --workspace=@tobu/web -- playwright install --with-deps chromium
      - name: Use installed Chromium for Karma
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_ENV, 'CHROME_BIN=' + require('@playwright/test').chromium.executablePath() + '\n')"
      - run: npm run quality:full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-results
          path: |
            test-results/quality.json
            apps/web/test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tobu-release
          path: dist/release/
          if-no-files-found: error
          retention-days: 7
  windows:
    name: Windows checks
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
          cache: npm
      - run: npm install --global npm@11.8.0
      - run: npm ci
      - run: npm exec --workspace=@tobu/web -- playwright install chromium
      - name: Use installed Chromium for Karma
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_ENV, 'CHROME_BIN=' + require('@playwright/test').chromium.executablePath() + '\n')"
      - run: npm run quality
