<div class="p-6">
  <h2 class="text-2xl font-semibold mb-6">Deine Konten</h2>

  <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6">
    <!-- Bestehende Accounts -->
    @for (account of accountsWithChart(); track account.id) {
      <div class="bg-white dark:bg-surface-800 rounded-2xl shadow-md p-4 flex flex-col justify-between cursor-pointer transform transition duration-200 hover:shadow-xl hover:scale-105"
        (click)="goToAccount(account.id)">
        <div>
          <h3 class="text-xl font-medium mb-1 text-surface-800 dark:text-surface-100">{{ account.name }}</h3>
          <p class="text-sm text-surface-600 dark:text-surface-400 mb-3">
            {{ account.participantCount }} {{ account.participantCount === 1 ? 'Teilnehmer' : 'Teilnehmer' }}
          </p>
          <p class="text-lg font-semibold text-primary">
            Kontostand: {{ account.currentBalance | currency:'EUR' }}
          </p>
        </div>
        <svg viewBox="0 0 100 30" preserveAspectRatio="none" class="w-full h-20">
          <defs>
            <linearGradient id="gradient" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%" stop-color="#f87171" stop-opacity="0.3" />
              <stop offset="100%" stop-color="#f87171" stop-opacity="0" />
            </linearGradient>
          </defs>

          <!-- Füllung -->
          <path
            [attr.d]="generateFilledPath(account.balanceHistory)"
            fill="url(#gradient)"
            stroke="none"
          />

          <!-- Linie -->
          <path
            [attr.d]="generatePath(account.balanceHistory)"
            fill="none"
            stroke="#f87171"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </div>
    }

    <!-- Account erstellen als Kachel -->
    <button
      type="button"
      (click)="goToWizard()"
      class="rounded-2xl border-dashed border-2 border-primary text-primary flex flex-col items-center justify-center text-center p-8 hover:bg-primary/10 transition"
    >
      <i class="pi pi-plus text-3xl mb-2"></i>
      <span class="text-lg font-medium">Neues Konto erstellen</span>
    </button>
  </div>
</div>
