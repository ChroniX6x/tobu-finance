<div
  class="p-6 space-y-6 bg-white dark:bg-surface-800 text-gray-900 dark:text-white min-h-screen"
>
  <!-- Header -->
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
    <div class="flex items-center gap-4">
      <h1 class="text-3xl font-bold">Gemeinschaftskonto</h1>
      <button
        type="button"
        class="text-blue-600 dark:text-blue-300 hover:text-blue-800 dark:hover:text-blue-200 p-2 rounded-full transition-colors"
        aria-label="Bearbeiten">
        <i class="pi pi-pencil text-xl"></i>
      </button>
    </div>
    <div
      class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4 text-center"
    >
      <div>
        <p class="text-2xl font-semibold">5.672 €</p>
        <p class="text-sm text-gray-500 dark:text-gray-400">Kontostand</p>
      </div>
      <div>
        <p class="text-lg font-medium text-green-500">+ 2,2 %</p>
        <p class="text-sm text-gray-500 dark:text-gray-400">Veränderung</p>
      </div>
      <div>
        <p class="text-lg font-medium">+ 5.800 €</p>
        <p class="text-sm text-gray-500 dark:text-gray-400">Prognose</p>
      </div>
      <div>
        <p class="text-lg font-medium">250 €</p>
        <p class="text-sm text-gray-500 dark:text-gray-400">Zusatzbeiträge</p>
      </div>
      <div>
        <p class="text-lg font-medium">500 €</p>
        <p class="text-sm text-gray-500 dark:text-gray-400">TopUps</p>
      </div>
    </div>
  </div>

  <!-- Quick Charts -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <p-card header="Verlaufskurve">
      <ng-template pTemplate="content">
        <div class="w-full h-24 bg-gray-100 dark:bg-gray-800 rounded"></div>
      </ng-template>
    </p-card>
    <p-card header="Einnahmen vs. Ausgaben">
      <ng-template pTemplate="content">
        <div class="w-full h-24 bg-gray-100 dark:bg-gray-800 rounded"></div>
      </ng-template>
    </p-card>
    <p-card header="Top 3 Kategorien">
      <ng-template pTemplate="content">
        <div class="w-full h-24 bg-gray-100 dark:bg-gray-800 rounded"></div>
      </ng-template>
    </p-card>
  </div>

  <!-- Action Buttons -->
  <div class="flex flex-wrap gap-4">
    <p-button label="Ausgabe hinzufügen" severity="success"></p-button>
    <p-button label="Einkommen anpassen" severity="info"></p-button>
    <p-button label="Zusatzbeitrag verwalten" severity="warn"></p-button>
    <p-button label="TopUps verwalten" severity="help"></p-button>
    <p-button label="Kategorien bearbeiten" severity="secondary"></p-button>
  </div>
  <!-- Tabs -->
  <p-tabs value="0" class="bg-white dark:bg-gray-800 rounded-lg shadow">
    <p-tablist>
      <p-tab value="0">Ausgaben</p-tab>
      <p-tab value="1">Einnahmen</p-tab>
      <p-tab value="2">Beiträge</p-tab>
      <p-tab value="3">Einstellungen</p-tab>
    </p-tablist>
    <p-tabpanels>
      <p-tabpanel value="0">
        <div class="w-full h-32 bg-gray-100 dark:bg-gray-800 rounded"></div>
      </p-tabpanel>
      <p-tabpanel value="1">
        <div class="w-full h-32 bg-gray-100 dark:bg-gray-800 rounded"></div>
      </p-tabpanel>
      <p-tabpanel value="2">
        <div class="w-full h-32 bg-gray-100 dark:bg-gray-800 rounded"></div>
      </p-tabpanel>
      <p-tabpanel value="3">
        <div class="w-full h-32 bg-gray-100 dark:bg-gray-800 rounded"></div>
      </p-tabpanel>
    </p-tabpanels>
  </p-tabs>
</div>
