<div class="p-6 bg-surface min-h-screen space-y-6">

  <!-- Header -->
  <div class="flex items-center justify-between">
    <h1 class="text-3xl font-bold text-text-primary">{{ account().name }}</h1>
    <button class="text-primary hover:text-primary-dark p-2 rounded-full" aria-label="Bearbeiten">
      <i class="pi pi-pencil text-xl"></i>
    </button>
  </div>

  <!-- Stats Cards -->
  <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-5 gap-4">
    <p-card *ngFor="let key of statKeys()" class="bg-surface-card text-center">
      <p class="text-sm text-text-secondary">{{ key.label }}</p>
      <p class="text-lg font-semibold text-text-primary">
        {{ key.value | number:'1.0-0' }}{{ key.suffix }}
      </p>
    </p-card>
  </div>

  <!-- Widget Cards -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <p-card header="Verlauf" class="bg-surface-card">
      <div class="h-24 bg-surface-border rounded"></div>
    </p-card>
    <p-card header="Einnahmen vs. Ausgaben" class="bg-surface-card">
      <div class="h-24 bg-surface-border rounded"></div>
    </p-card>
    <p-card header="Top Kategorien" class="bg-surface-card">
      <div class="h-24 bg-surface-border rounded"></div>
    </p-card>
  </div>

  <!-- Action Buttons -->
  <div class="flex flex-wrap gap-3">
    <button pButton label="Ausgabe" icon="pi pi-money-bill" class="p-button-success"></button>
    <button pButton label="Einkommen" icon="pi pi-wallet" class="p-button-info"></button>
    <button pButton label="Beitrag" icon="pi pi-coins" class="p-button-warning"></button>
    <button pButton label="TopUp" icon="pi pi-arrow-up" class="p-button-help"></button>
  </div>

  <!-- Detail-Link Cards -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
    <p-card header="Ausgaben" class="cursor-pointer hover:shadow-lg">
      <p class="text-sm text-text-secondary">Letzte Buchung: {{ account().recent.lastExpense }}</p>
      <p class="text-md text-text-primary">{{ account().recent.topCats }}</p>
    </p-card>
    <p-card header="Einnahmen" class="cursor-pointer hover:shadow-lg">
      <p class="text-sm text-text-secondary">Status Übersicht</p>
    </p-card>
    <p-card header="Beiträge" class="cursor-pointer hover:shadow-lg">
      <p class="text-sm text-text-secondary">Plan & Sonderbeiträge</p>
    </p-card>
    <p-card header="Einstellungen" class="cursor-pointer hover:shadow-lg">
      <p class="text-sm text-text-secondary">Mitglieder, Regeln etc.</p>
    </p-card>
  </div>

</div>
