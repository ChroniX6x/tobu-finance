services:
  mongo:
    image: mongo:9.0.4
    command: ["mongod", "--replSet", "tobu-local", "--bind_ip_all"]
    ports:
      - "127.0.0.1:${DB_PORT:-27018}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
volumes:
  mongo-data:
